<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK CREATIVES Login</title>
    <style>
        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #4d0000 0%, #0a0a0a 100%) no-repeat fixed;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            overflow: hidden;
        }

        .login-card {
            background-color: rgba(20, 20, 20, 0.7);
            padding: 45px 40px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        .logo-section { margin-bottom: 25px; }
        
        .logo-container { 
            width: 120px; 
            height: 120px; 
            margin: 0 auto 15px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: soft-glow 5s ease-in-out infinite;
        }
        
        @keyframes soft-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); } 
        }
        
        .brand-logo { 
            max-width: 85%; 
            max-height: 85%; 
            object-fit: contain; 
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5));
            border-radius: 50%;
        }

        .brand-name { 
            color: #ffffff; 
            font-size: 28px; 
            font-weight: 900; 
            margin: 0; 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }
        
        .slogan { 
            color: #ff3333;
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-top: 8px; 
            font-weight: bold;
            opacity: 0.8;
        }

        .login-title { 
            color: #ffffff; 
            font-size: 13px; 
            margin: 30px 0 20px 0; 
            font-weight: 300; 
            letter-spacing: 5px; 
            opacity: 0.6; 
        }
        
        input { 
            width: 100%; 
            padding: 14px 18px; 
            margin-bottom: 15px; 
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            color: white; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.3s;
        }

        input:focus { 
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #ff3333;
        }
        
        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            background: transparent; 
            border: 1px solid #ff3333; 
            border-radius: 8px; 
            color: #ff3333; 
            font-size: 13px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: 0.3s;
        }

        button:hover { 
            background: #ff3333; 
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
        }
        
        .error-msg { 
            color: #ff6666; 
            font-size: 12px; 
            margin-bottom: 15px; 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <header class="logo-section">
            <div class="logo-container">
                <img src="./images/logo.jpg" alt="JK Creatives Logo" class="brand-logo">
            </div>
            <h1 class="brand-name">JK CREATIVES</h1>
            <p class="slogan">Beyond Fiction through the lens</p>
        </header>

        <h2 class="login-title">LOGIN</h2>
        <div id="error-box" class="error-msg">Invalid Username or Password</div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Enter</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            if (user === "admin" && pass === "admin") {
                window.location.href = "home.html";
            } else {
                errorBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
